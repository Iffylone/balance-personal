name: Construir instalador Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyinstaller
        working-directory: pc
      - run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name SistContiffy --icon assets\icon.ico --add-data "assets;assets" main.py
        working-directory: pc
      - run: choco install innosetup -y --no-progress
      - run: iscc instalador.iss
        working-directory: pc
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: pc/salida/Instalar_Balance_personal.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Instalar_Balance_personal
          path: pc/salida/Instalar_Balance_personal.exe
